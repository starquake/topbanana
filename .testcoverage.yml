# Test coverage configuration

# Total-coverage threshold is enforced in .github/workflows/ci.yml: the
# action's threshold-total input defaults to -1 and overrides any value
# set here, so a threshold in this file has no effect. See #667.

# Regexps over module-relative file paths; mirrors the -coverpkg filter
# in the Makefile's test-coverage target.
exclude:
  paths:
    - ^internal/dbtest/
    - ^internal/testutil/
    - ^cmd/seed-dev/
    - ^internal/db/[^/]+$

# Path to the coverage profile file
profile: build/coverage/coverage.out
