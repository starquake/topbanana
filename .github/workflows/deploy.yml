name: Deploy

# Where each build goes:
#   - development: every merge to main, plus a deploy:dev-labeled PR's own
#     build until the next main deploy takes the slot back.
#   - staging: release candidates, tags vYYYY.M.N-rc.K.
#   - production and demo: releases, tags vYYYY.M.N.
# Tags retag the image main already built, tested and signed (ci.yml's
# promote job), so staging, production and demo run bytes CI verified.
# The GHCR package is public, so hosts pull anonymously and hold no registry token.
#
# Each environment runs on zoot as its own user, topbanana-<env>, with rootless
# Podman: the jobs install deployments/podman's Quadlet unit there and restart
# it (deploy-ssh.sh runs deploy.sh on the server). The server side (users,
# ports, Caddy) is set up by linuxeverywhere-infra; see deployments/README.md.

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - development
          - staging
          - production
          - demo
      version:
        description: 'Version, e.g. 2026.10.0-rc.1 (required for staging) or 2026.10.0 (production and demo; empty means the latest release). Development always deploys the latest main build.'
        required: false
        type: string
  # pull_request_target runs main's copy of this file, so a PR cannot rewrite
  # the preview job to reach the development secrets or the host.
  pull_request_target:
    branches: [main]
    types: [labeled, synchronize]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy-development:
    runs-on: ubuntu-latest
    # Read-only token: the runner resolves + verifies the image digest
    # and the host pulls by it; nothing here writes packages.
    permissions:
      contents: read
      packages: read
    # Every merge to main. Inert until the development host exists.
    if: >-
      vars.DEVELOPMENT_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main') ||
       (github.event_name == 'workflow_dispatch' && inputs.environment == 'development'))
    # Its own queue, so a preview run can never replace a pending main deploy;
    # a lock on the host (deploy.sh) serializes the two jobs' deploys.
    concurrency:
      group: deploy-development
      cancel-in-progress: false
    environment:
      name: development
      url: "${{ vars.SERVER_URL }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v2.2.4'

      # Resolve the mutable :edge tag to the immutable digest the host
      # pulls. CI publishes :edge only from main's docker-build, so it
      # points at this commit's tested, signed image. Pinning the deploy
      # to the digest means a later tag move cannot swap the running bytes.
      - name: Resolve image digest
        id: digest
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:edge
        run: |
          set -euo pipefail
          DIGEST="$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{.Manifest.Digest}}')"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: could not resolve a digest for ${IMAGE_REF} (got '${DIGEST}')" >&2
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      # Reject the deploy unless the digest carries a valid keyless
      # signature from this repo's CI workflow on main. docker-build
      # signs the digest there; the signature binds to the digest, so a
      # forged or untrusted image fails here before the host pulls it.
      - name: Verify image signature
        env:
          IMAGE_DIGEST_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
        run: |
          cosign verify "$IMAGE_DIGEST_REF" \
            --certificate-identity-regexp '^https://github\.com/starquake/topbanana/\.github/workflows/ci\.yml@refs/heads/main$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'

      # The env file is made here, from the environment's secrets and
      # variables, and reaches the server only over SSH's standard input
      # (deploy-ssh.sh); deploy.sh installs it with the unit and restarts the
      # app as the environment's own user (deployments/README.md).
      - name: Deploy to development server
        env:
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
          # Google sign-in is part of the standard development deployment: all
          # three are required, and the redirect URL must match the Google
          # Cloud Console OAuth client exactly.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URL: ${{ secrets.GOOGLE_REDIRECT_URL }}
          # SMTP_* are optional: with none set the app keeps its no-op mailer
          # and /admin/email says "disabled (no-op)"; a partial set fails the
          # boot in the Go config layer. SMTP_PORT and SMTP_TLS go in pairs:
          # 587 + true (STARTTLS) or 25 + false; 465 (implicit TLS) is not
          # supported.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TLS: ${{ secrets.SMTP_TLS }}
          # Variables, not secrets: public values, which masking in logs only
          # hides. BASE_URL prefixes the links in outbound email (#489).
          BASE_URL: ${{ vars.BASE_URL }}
          # Fail-closed: opening registration always takes setting this variable.
          REGISTRATION_ENABLED: ${{ vars.REGISTRATION_ENABLED || 'false' }}
          # The admin allowlist at registration (#446).
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS || 'admin@example.test' }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_ENV: development
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          upload="$RUNNER_TEMP/upload"
          mkdir -p "$upload"
          cp deployments/podman/deploy.sh deployments/podman/development.container "$upload/"
          REQUIRED="SESSION_KEY GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REDIRECT_URL" \
            bash deployments/podman/write-env.sh "$upload/topbanana.env" \
            SESSION_KEY GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REDIRECT_URL \
            SMTP_HOST SMTP_PORT SMTP_USERNAME SMTP_PASSWORD SMTP_FROM SMTP_TLS \
            BASE_URL REGISTRATION_ENABLED ADMIN_EMAILS
          bash deployments/podman/deploy-ssh.sh "$upload"

      - name: Verify development deployment
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "${{ secrets.HEALTH_URL }}" >/dev/null; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Health check attempt $i/12 failed; retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after 12 attempts (60s); failing the deploy" >&2
          exit 1

  # Deploy a labeled pull request into the development slot (#1242): put
  # deploy:dev on a PR and its build replaces main's until the next main
  # deploy. It builds the PR's own code, so it does not wait for the suite,
  # and it gets no mail or Google credentials: this code is not reviewed yet.
  # Same-repo only; a fork PR gets no secrets from GitHub regardless.
  deploy-development-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: >-
      vars.DEVELOPMENT_DEPLOY_ENABLED == 'true' &&
      github.event_name == 'pull_request_target' &&
      contains(github.event.pull_request.labels.*.name, 'deploy:dev') &&
      (github.event.action != 'labeled' || github.event.label.name == 'deploy:dev') &&
      github.event.pull_request.head.repo.full_name == github.repository
    # A newer preview replaces a pending one; main deploys queue separately.
    concurrency:
      group: deploy-development-preview
      cancel-in-progress: false
    environment:
      name: development
      url: "${{ vars.SERVER_URL }}"

    steps:
      # The unit and the deploy scripts come from main; the PR's tree is only
      # the build context.
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No cosign: the digest comes straight out of this build step, so there
      # is no untrusted registry hop for a signature to protect.
      - name: Build and push PR image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: pr
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          build-args: |
            COMMIT=${{ github.event.pull_request.head.sha }}
            DATE=${{ github.event.pull_request.updated_at }}
          # No cache-to: a run started from a PR only gets a read-only cache token.
          cache-from: type=gha

      - name: Resolve image digest
        id: digest
        env:
          BUILD_DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$BUILD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: build did not return a digest (got '${BUILD_DIGEST}')" >&2
            exit 1
          fi
          echo "digest=${BUILD_DIGEST}" >> "$GITHUB_OUTPUT"

      # The unit and deploy.sh come from main's checkout, never the PR's.
      - name: Deploy to development server
        env:
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
          INITIAL_ADMIN_EMAIL: ${{ secrets.INITIAL_ADMIN_EMAIL }}
          INITIAL_ADMIN_PASSWORD: ${{ secrets.INITIAL_ADMIN_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_ENV: development-preview
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [ -n "$SESSION_KEY" ] || { echo "ERROR: SESSION_KEY is empty or unset; refusing to deploy" >&2; exit 1; }
          # A key per PR, so cookies from main's build or another PR never
          # validate against this database (its player ids start over).
          SESSION_KEY="$(printf '%s\npreview-%s' "$SESSION_KEY" "$PR_NUMBER" | sha256sum | cut -d' ' -f1)"
          export SESSION_KEY
          upload="$RUNNER_TEMP/upload"
          mkdir -p "$upload"
          cp deployments/podman/deploy.sh deployments/podman/development-preview.container "$upload/"
          REQUIRED="SESSION_KEY INITIAL_ADMIN_EMAIL INITIAL_ADMIN_PASSWORD" \
            bash deployments/podman/write-env.sh "$upload/topbanana.env" \
            SESSION_KEY INITIAL_ADMIN_EMAIL INITIAL_ADMIN_PASSWORD
          bash deployments/podman/deploy-ssh.sh "$upload"

      - name: Verify development deployment
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "$HEALTH_URL" >/dev/null; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Health check attempt $i/12 failed; retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after 12 attempts (60s); failing the deploy" >&2
          exit 1

  deploy-staging:
    runs-on: ubuntu-latest
    # Read-only token: the runner resolves + verifies the image digest
    # and the host pulls by it; nothing here writes packages.
    permissions:
      contents: read
      packages: read
    # Release-candidate tags, vYYYY.M.N-rc.K.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository &&
        startsWith(github.event.workflow_run.head_branch, 'v') && contains(github.event.workflow_run.head_branch, '-rc.')) ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: "${{ vars.SERVER_URL }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # A release-candidate tag deploys that candidate; a manual dispatch
      # deploys the candidate named in the version input.
      - name: Determine image tag
        id: tag
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          IMAGE_TAG="${HEAD_BRANCH:-$VERSION}"
          IMAGE_TAG="${IMAGE_TAG#v}"
          if [[ ! "$IMAGE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "ERROR: staging deploys release candidates (X.Y.Z-rc.N); got '${IMAGE_TAG}'" >&2
            exit 1
          fi
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v2.2.4'

      # Resolve the release-candidate tag to the immutable digest the host pulls.
      # The version tag is created by promote retagging the tested,
      # signed sha-<commit> image from main, so the digest is the same
      # one CI signed. Pinning the deploy to it means a later tag move
      # cannot swap the running bytes.
      - name: Resolve image digest
        id: digest
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          DIGEST="$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{.Manifest.Digest}}')"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: could not resolve a digest for ${IMAGE_REF} (got '${DIGEST}')" >&2
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      # Reject the deploy unless the digest carries a valid keyless
      # signature from this repo's CI workflow on main. docker-build
      # signs the digest there; the signature binds to the digest, so a
      # forged or untrusted image fails here before the host pulls it.
      - name: Verify image signature
        env:
          IMAGE_DIGEST_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
        run: |
          cosign verify "$IMAGE_DIGEST_REF" \
            --certificate-identity-regexp '^https://github\.com/starquake/topbanana/\.github/workflows/ci\.yml@refs/heads/main$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'

      # The env file is made here, from the environment's secrets and
      # variables, and reaches the server only over SSH's standard input
      # (deploy-ssh.sh); deploy.sh installs it with the unit and restarts the
      # app as the environment's own user (deployments/README.md).
      - name: Deploy to staging server
        env:
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
          # Google sign-in is part of the standard staging deployment: all
          # three are required, and the redirect URL must match the Google
          # Cloud Console OAuth client exactly.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URL: ${{ secrets.GOOGLE_REDIRECT_URL }}
          # SMTP_* are optional: with none set the app keeps its no-op mailer
          # and /admin/email says "disabled (no-op)"; a partial set fails the
          # boot in the Go config layer. SMTP_PORT and SMTP_TLS go in pairs:
          # 587 + true (STARTTLS) or 25 + false; 465 (implicit TLS) is not
          # supported.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TLS: ${{ secrets.SMTP_TLS }}
          # Variables, not secrets: public values, which masking in logs only
          # hides. BASE_URL prefixes the links in outbound email (#489).
          BASE_URL: ${{ vars.BASE_URL }}
          # Fail-closed: opening registration always takes setting this variable.
          REGISTRATION_ENABLED: ${{ vars.REGISTRATION_ENABLED || 'false' }}
          # The admin allowlist at registration (#446).
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS || 'admin@example.test' }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_ENV: staging
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          upload="$RUNNER_TEMP/upload"
          mkdir -p "$upload"
          cp deployments/podman/deploy.sh deployments/podman/staging.container "$upload/"
          REQUIRED="SESSION_KEY GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REDIRECT_URL" \
            bash deployments/podman/write-env.sh "$upload/topbanana.env" \
            SESSION_KEY GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REDIRECT_URL \
            SMTP_HOST SMTP_PORT SMTP_USERNAME SMTP_PASSWORD SMTP_FROM SMTP_TLS \
            BASE_URL REGISTRATION_ENABLED ADMIN_EMAILS
          bash deployments/podman/deploy-ssh.sh "$upload"

      - name: Verify staging deployment
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "${{ secrets.HEALTH_URL }}" >/dev/null; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Health check attempt $i/12 failed; retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after 12 attempts (60s); failing the deploy" >&2
          exit 1

  deploy-production:
    runs-on: ubuntu-latest
    # Read-only token: the runner resolves + verifies the image digest
    # and the host pulls by it; nothing here writes packages.
    permissions:
      contents: read
      packages: read
    # Release tags, vYYYY.M.N (no pre-release suffix).
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository &&
        startsWith(github.event.workflow_run.head_branch, 'v') && !contains(github.event.workflow_run.head_branch, '-')) ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: "${{ vars.SERVER_URL }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # A release tag deploys that release; a manual dispatch deploys the
      # version input, or the latest release when it is empty.
      - name: Determine image tag
        id: tag
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          IMAGE_TAG="${HEAD_BRANCH:-$VERSION}"
          IMAGE_TAG="${IMAGE_TAG#v}"
          if [ -z "$IMAGE_TAG" ]; then
            IMAGE_TAG="latest"
          elif [[ ! "$IMAGE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: production deploys releases (X.Y.Z); got '${IMAGE_TAG}'" >&2
            exit 1
          fi
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v2.2.4'

      # Resolve the release tag to the immutable digest the host pulls.
      # The version tag is created by promote retagging the tested,
      # signed sha-<commit> image from main, so the digest is the same
      # one CI signed. Pinning the deploy to it means a later tag move
      # cannot swap the running bytes.
      - name: Resolve image digest
        id: digest
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          DIGEST="$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{.Manifest.Digest}}')"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: could not resolve a digest for ${IMAGE_REF} (got '${DIGEST}')" >&2
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      # Reject the deploy unless the digest carries a valid keyless
      # signature from this repo's CI workflow on main. docker-build
      # signs the digest there; the signature binds to the digest, so a
      # forged or untrusted image fails here before the host pulls it.
      - name: Verify image signature
        env:
          IMAGE_DIGEST_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
        run: |
          cosign verify "$IMAGE_DIGEST_REF" \
            --certificate-identity-regexp '^https://github\.com/starquake/topbanana/\.github/workflows/ci\.yml@refs/heads/main$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'

      # The env file is made here, from the environment's secrets and
      # variables, and reaches the server only over SSH's standard input
      # (deploy-ssh.sh); deploy.sh installs it with the unit and restarts the
      # app as the environment's own user (deployments/README.md).
      - name: Deploy to production server
        env:
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
          # Google sign-in is part of the standard production deployment: all
          # three are required, and the redirect URL must match the Google
          # Cloud Console OAuth client exactly.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URL: ${{ secrets.GOOGLE_REDIRECT_URL }}
          # SMTP_* are optional: with none set the app keeps its no-op mailer
          # and /admin/email says "disabled (no-op)"; a partial set fails the
          # boot in the Go config layer. SMTP_PORT and SMTP_TLS go in pairs:
          # 587 + true (STARTTLS) or 25 + false; 465 (implicit TLS) is not
          # supported.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TLS: ${{ secrets.SMTP_TLS }}
          # Variables, not secrets: public values, which masking in logs only
          # hides. BASE_URL prefixes the links in outbound email (#489).
          BASE_URL: ${{ vars.BASE_URL }}
          # Fail-closed: opening registration always takes setting this variable.
          REGISTRATION_ENABLED: ${{ vars.REGISTRATION_ENABLED || 'false' }}
          # The admin allowlist at registration (#446).
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS || 'admin@example.test' }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_ENV: production
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          upload="$RUNNER_TEMP/upload"
          mkdir -p "$upload"
          cp deployments/podman/deploy.sh deployments/podman/production.container "$upload/"
          REQUIRED="SESSION_KEY GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REDIRECT_URL" \
            bash deployments/podman/write-env.sh "$upload/topbanana.env" \
            SESSION_KEY GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REDIRECT_URL \
            SMTP_HOST SMTP_PORT SMTP_USERNAME SMTP_PASSWORD SMTP_FROM SMTP_TLS \
            BASE_URL REGISTRATION_ENABLED ADMIN_EMAILS
          bash deployments/podman/deploy-ssh.sh "$upload"

      - name: Verify production deployment
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "${{ secrets.HEALTH_URL }}" >/dev/null; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Health check attempt $i/12 failed; retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after 12 attempts (60s); failing the deploy" >&2
          exit 1

  deploy-demo:
    runs-on: ubuntu-latest
    # Read-only token: the runner resolves + verifies the image digest
    # and the host pulls by it; nothing here writes packages.
    permissions:
      contents: read
      packages: read
    # Release tags only, so the public demo runs released code. Gated so a
    # missing demo host does not red the release pipeline.
    if: >-
      vars.DEMO_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository &&
        startsWith(github.event.workflow_run.head_branch, 'v') && !contains(github.event.workflow_run.head_branch, '-')) ||
       (github.event_name == 'workflow_dispatch' && inputs.environment == 'demo'))
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    environment:
      name: demo
      url: "${{ vars.SERVER_URL }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # A release tag deploys that release; a manual dispatch deploys the
      # version input, or the latest release when it is empty.
      - name: Determine image tag
        id: tag
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          IMAGE_TAG="${HEAD_BRANCH:-$VERSION}"
          IMAGE_TAG="${IMAGE_TAG#v}"
          if [ -z "$IMAGE_TAG" ]; then
            IMAGE_TAG="latest"
          elif [[ ! "$IMAGE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: demo deploys releases (X.Y.Z); got '${IMAGE_TAG}'" >&2
            exit 1
          fi
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v2.2.4'

      # Resolve the release tag to the immutable digest the host pulls.
      # The version tag is created by promote retagging the tested,
      # signed sha-<commit> image from main, so the digest is the same
      # one CI signed. Pinning the deploy to it means a later tag move
      # cannot swap the running bytes.
      - name: Resolve image digest
        id: digest
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          DIGEST="$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{.Manifest.Digest}}')"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: could not resolve a digest for ${IMAGE_REF} (got '${DIGEST}')" >&2
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      # Reject the deploy unless the digest carries a valid keyless
      # signature from this repo's CI workflow on main. docker-build
      # signs the digest there; the signature binds to the digest, so a
      # forged or untrusted image fails here before the host pulls it.
      - name: Verify image signature
        env:
          IMAGE_DIGEST_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
        run: |
          cosign verify "$IMAGE_DIGEST_REF" \
            --certificate-identity-regexp '^https://github\.com/starquake/topbanana/\.github/workflows/ci\.yml@refs/heads/main$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'

      # The env file is made here and reaches the server only over SSH's
      # standard input (deploy-ssh.sh). The demo quiz archives go along in
      # seed/; on a server without a demo database yet, deploy.sh loads the
      # demo baseline before the app starts.
      - name: Deploy to demo server
        env:
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_ENV: demo
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          upload="$RUNNER_TEMP/upload"
          mkdir -p "$upload/seed"
          cp deployments/podman/deploy.sh deployments/podman/demo.container deployments/podman/demo-seed.container "$upload/"
          cp dev/fixtures/demo/*.zip "$upload/seed/"
          REQUIRED="SESSION_KEY" \
            bash deployments/podman/write-env.sh "$upload/topbanana.env" \
            SESSION_KEY ADMIN_EMAILS
          bash deployments/podman/deploy-ssh.sh "$upload"

      - name: Verify demo deployment
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "${{ secrets.HEALTH_URL }}" >/dev/null; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Health check attempt $i/12 failed; retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after 12 attempts (60s); failing the deploy" >&2
          exit 1
