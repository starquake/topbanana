name: Demo reset

on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC daily
  workflow_dispatch: {}

permissions: {}

jobs:
  reset:
    runs-on: ubuntu-latest
    if: vars.DEMO_DEPLOY_ENABLED == 'true'
    # Shares deploy-demo's group so a wipe never overlaps a deploy.
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    environment:
      name: demo
    steps:
      - name: Wipe demo data and restart
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # No secret goes along: the settings are the ones the last
          # deploy-demo installed (~/.config/topbanana/topbanana.env), and the
          # seed unit and quiz archives (~/data/seed) came with it
          # (deployments/README.md, "The demo").
          script: |
            set -eu
            : "${XDG_RUNTIME_DIR:=/run/user/$(id -u)}"
            export XDG_RUNTIME_DIR
            cd "$HOME"
            # deploy.sh's lock: a wipe never overlaps a deploy.
            exec 9> .deploy.lock
            flock -w 900 9
            # DB and media live in ~/data/topbanana, the image's user mapped
            # to this one, so emptying it needs no Podman.
            systemctl --user stop topbanana.service
            rm -rf "$HOME/data/topbanana"
            mkdir "$HOME/data/topbanana"
            systemctl --user start topbanana-seed.service
            systemctl --user start topbanana.service
