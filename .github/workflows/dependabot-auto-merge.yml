name: Dependabot auto-merge

on:
  pull_request:

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Skip only /tools direct requires: those versions have to be mirrored into
      # the Makefile + ci.yml by hand. Indirect bumps there are mirrored nowhere.
      # Safe under the signed-commit ruleset: Dependabot signs its own rebases and GitHub signs the squash-merge.
      - name: Enable auto-merge
        if: steps.meta.outputs.directory != '/tools' || !startsWith(steps.meta.outputs.dependency-type, 'direct')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Auto-merge alone does not land a PR that main has moved past: the ruleset is
# strict. Bringing the branch forward is manual (a local `git rebase origin/main`
# + force-push, which re-signs the commits) - deliberately, not by omission.
# A `rebase-stale` job used to post `@dependabot rebase` here; Dependabot refuses
# commands from github-actions[bot] ("only users with push access"), so it never
# once worked while reporting success on every run. See #1294 before re-adding
# anything of that shape.
